<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none" class="w-full h-full">
    <!-- Speed Motion Trails (Orange) -->
    <path d="M5 25 H28 L23 32 H10 Z" fill="url(#orangeGrad)" opacity="0.95"/>
    <path d="M12 37 H35 L30 44 H16 Z" fill="url(#orangeGrad)"/>
    <path d="M2 50 H24 L19 57 H6 Z" fill="url(#orangeGrad)" opacity="0.85"/>
    <path d="M18 63 H38 L33 69 H22 Z" fill="url(#orangeGrad)" opacity="0.9"/>

    <!-- Runner Head (Purple) -->
    <circle cx="68" cy="14" r="8" fill="#3B0764"/>

    <!-- Runner Body & Limbs (Deep Purple / Indigo) -->
    <!-- Torso and Leading Leg -->
    <path d="M46 22 L62 20 L52 46 L68 56 L63 68 L44 54 L49 42 L38 34 Z" fill="url(#purpleGrad)"/>
    
    <!-- Trailing Leg -->
    <path d="M48 46 L30 68 L36 74 L54 52 Z" fill="url(#purpleGrad)"/>

    <!-- Forward Arm -->
    <path d="M58 24 L76 22 L72 32 L60 29 Z" fill="url(#purpleGrad)"/>
    
    <!-- Backward Arm (Trailing) -->
    <path d="M44 26 L34 35 L38 40 L48 30 Z" fill="#EA580C"/>

    <defs>
        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FF7A00"/>
            <stop offset="100%" stop-color="#EA580C"/>
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6B21A8"/>
            <stop offset="100%" stop-color="#3B0764"/>
        </linearGradient>
    </defs>
</svg>
